name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DiaryApp.xcodeproj \
            -target DiaryApp \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/out" \
            build

      - name: Package into ipa
        run: |
          mkdir -p Payload
          cp -R out/Release-iphoneos/DiaryApp.app Payload/
          zip -qry DiaryApp.ipa Payload
          ls -lh DiaryApp.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiaryApp-unsigned-ipa
          path: DiaryApp.ipa
          retention-days: 30

      - name: Publish release with ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 日记本 IPA
          files: DiaryApp.ipa
