name: Moye

options:
  bundleIdPrefix: com.sasigai1
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Moye:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasigai1.moye
        PRODUCT_NAME: Moye
        MARKETING_VERSION: "9.0"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MoyeInfo.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "连接你局域网里的 Emby 服务器"
        INFOPLIST_KEY_CFBundleDisplayName: "墨页"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用面容 ID 解锁你的笔记"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "插入图片到笔记"
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描文档并识别文字"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Moye:
    build:
      targets:
        Moye: all
    run:
      config: Release
